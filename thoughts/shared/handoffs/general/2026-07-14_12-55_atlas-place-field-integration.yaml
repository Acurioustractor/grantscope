decisions:
  - atlas_is_the_entry: Do not add Barkly or future regions as permanent sidebar destinations; search and Place Fields live inside Atlas.
  - place_is_configuration: New places use a registry entry plus a normalised loader adapter, not copied navigation or workspace UI.
  - authority_is_separate: Community-controlled status and geographic adjacency are context, not evidence of authority, consent or permission to approach.
  - preserve_investigation_context: Place communities and organisations route to Atlas search/panels; Goods dossiers remain a secondary operational action.

findings:
  - live_barkly_state: The rendered field showed 8 indexed communities, 122 regional organisations, 61 community-controlled organisations, 214 Goods assets, 1350 recorded needs, 9 justice records and 0 directly linked ACT people.
  - search_behaviour: Searching Tennant Creek now orders the exact community first, Barkly Place Field second, then connected organisations.
  - legacy_route: /org/act/barkly emits a Next redirect instruction to /org/act/explore/place/barkly, but the in-app browser harness did not update its address bar.
  - live_palm_island_state: The rendered field showed 1 indexed community, 32 regional organisations, 12 community-controlled organisations, 141 Goods assets, 116 recorded needs, 24 justice records and 0 directly linked ACT people.
  - palm_island_search_behaviour: /org/act/explore?q=Palm%20Island renders Palm Island Atlas results and /org/act/explore/place/palm-island renders the canonical Place Field.

worked: [Using Atlas existing record panel and connection field, registry-driven presentation, canonical nested routing, browser-testing the complete Atlas to Place Field to community flow]
