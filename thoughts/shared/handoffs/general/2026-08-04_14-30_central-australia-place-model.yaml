corrections_made_to_earlier_conclusions:
  - claim: Central Australia is a construction economy where community-controlled organisations hold 24% of the money.
    correction: >
      True of contracts alone, and contracts are the minority channel. With grants included the
      total is $3,626M rather than $789.7M and the community-controlled share is 60%, not 24%.
      Central Australian Aboriginal Congress holds $332M, Nganampa Health $200M with no contracts
      at all. The error was calling contracts "the money".
  - claim: The Utopia arts and land corporations are culturally significant organisations invisible to every map.
    correction: >
      They are deregistered. ORIC publishes no address once a corporation is deregistered, which
      is why they had no location. Showing them as current would have been the error.
  - claim: Delivery attribution lets remote communities finally be seen.
    correction: >
      It does, across 7% of the money. NIAA publishes a delivery location on 2% of its 11,856
      awards and Social Services on none of 30,068, so the streams that matter most here are the
      least visible by place.

accuracy_ladder:
  - rank: 1
    item: Delivery-location coverage
    detail: >
      $242.7M of grant money to this region is placeable, $3,233M is not. The bias is not random:
      infrastructure and education publish delivery, Indigenous affairs and social services do
      not. No ingest fixes this — it is a publishing choice. Options are to model delivery from
      grant purpose text, to ask NIAA directly, or to state the limit and stop implying place
      coverage we do not have. Currently stated in red at the top of the page.
  - rank: 2
    item: Land council and royalty flows
    detail: >
      Mining royalties reach communities through the Aboriginal Benefit Account and the four NT
      land councils. 129 ABA awards ($47.4M) are in GrantConnect, but per-corporation royalty
      distribution is not public. Land councils appear in gs_relationships only through
      shared_director links with no amounts. Sources would be NIAA annual report tables or land
      council annual reports, neither of which is bulk data.
  - rank: 3
    item: 123 organisations that cannot be placed
    detail: >
      75 registered Aboriginal corporations plus 43 deregistered, mostly homeland and outstation
      bodies with language names. 41 of 75 have no ABN, so they are unmatchable to funding data
      regardless of geography. ORIC states it is not its practice to provide data services to
      external parties; the ABN Bulk Extract carries only state and postcode, which we already
      have. Closing this needs a direct approach to ORIC or to the communities.
  - rank: 4
    item: One remaining GrantConnect cap
    detail: >
      Department of Education / Children, Youth and Youth at Risk still exceeds 50,000 rows.
      Agency and category are honoured as filters; date is not. A third filter — selection
      process or value range — may subdivide it.
  - rank: 5
    item: Person identity for relationship paths
    detail: >
      funder_board_paths is built on person_identities, but cross-organisation identity cannot be
      verified without a real person key such as an ASIC director ID. 1,917 of 2,651 paths are
      high collision risk. Do not present any path as fact.

data_model:
  entities: gs_entities — now carries oric_status, oric_sector, oric_size, oric_income_band, oric_employee_band, lga_source
  place: mv_lga_place_profile — one row per council; refresh CONCURRENTLY after any ingest
  organisations: v_org_funding_profile — one row per organisation, each funding channel separate
  geography: abs_locality_lga — ABS locality to council, the reference postcodes cannot provide
  gaps_register: geo_resolution_gaps — what is missing and the source that would close it
  grants: grantconnect_awards — includes recipient and delivery location
  do_not_use:
    - mv_funding_deserts — 1,988 rows for 1,103 LGAs with conflicting values; superseded by mv_lga_place_profile
    - place_funding_snapshot — orphaned, predates the council fix and GrantConnect
    - foundations.type — unverified, wrong at scale, no authoritative source exists

worked:
  - Verifying every inference against the data before applying it. The jurisdiction guard caught Western Aranda Health matching a Canberra suburb and Research "Us" matching a Melbourne suburb.
  - Rehearsing migrations in BEGIN/ROLLBACK before applying. It caught a latent duplicate that made mv_evidence_backed_funding unrebuildable.
  - Grading every field rather than blending into one score. It made the claimed-versus-demonstrated gap visible for funders claiming an Indigenous focus they do not fund.
  - Asking what a number would look like if it were wrong, then checking that specific thing.

failed:
  - Trusting gs_entities.state for postcode 0872. The state was itself inherited from the postcode, which spans three states.
  - Scattering 1,199 organisations around postcode centroids to keep markers clickable. It invented geography.
  - Applying a limit before a filter, three times: region filtered in JS after a 2,000 row cap, PostgREST's hard 1,000 row cap on a postcode lookup, and an alphabetical cap that cut the Utopia names.
  - next/dynamic with ssr:false in a Server Component, against the rule in CLAUDE.md.
  - Assuming date windows could beat the GrantConnect 50,000 cap. The export ignores its own date filter.

next:
