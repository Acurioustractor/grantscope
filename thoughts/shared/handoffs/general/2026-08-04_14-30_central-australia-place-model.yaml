  - Approach NIAA about delivery location, and ORIC about addresses. Both are relationship moves rather than engineering.
  - Build the email version of the place page, which was in the original ask and is not done.
  - Drop place_funding_snapshot and rebuild_place_funding_snapshot, now orphaned.
  - Re-check mv_funding_deserts consumers — anything reading it today is reading noise.

open_question: >
  Should council-delivered money read as reaching the community, or be distinguished from money
  a community organisation holds directly? Those are different stories about self-determination
  and the data can now tell them apart. Local retention is the measure: Alice Springs 76.2%,
  Barkly 73.7%, MacDonnell 5.8%.

