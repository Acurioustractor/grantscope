    files: [supabase/migrations/20260804090000_abs_locality_lga.sql, supabase/migrations/20260804091000_place_entities_from_abs_locality.sql]
  - task: Joined oric_corporations to gs_entities for the first time — 7,369 rows that had sat unused. Brought registration status, sector, size, income band and workforce band onto entities.
