goal: >
  Make it possible for a community to see what money reaches its place, who holds it, and
  what is missing — starting with Mparntwe (Alice Springs), Tennant Creek and the Utopia
  homelands. Built the data model, the corrections and a live map. The accuracy ceiling is
  now understood and is set by what governments publish, not by our code.

now: >
  Read first_principles below, then work the accuracy_ladder in order. The single highest
  leverage item is that 93% of grant money reaching Central Australian organisations cannot
  be placed geographically, and the gap is biased against exactly the communities this work
  exists to serve.

test: cd apps/web && npx tsc --noEmit && npx vitest run tests/unit/lib/services/

first_principles:
  what_this_is_for: >
    Not a grants database. A way for a community to answer three questions about its own
    money — what comes here, who holds it, and who decided — using only public records that
    can be checked. Everything else is scaffolding.
  the_governing_rule: >
    A wrong number about a real community is worse than no number. Internally a bad figure
    costs an afternoon; published, it becomes a claim about people who did not ask to be
    described. So every layer carries its own grade, absence is shown rather than implied,
    and inference is labelled as inference. This is why the page leads with what it cannot
    tell you.
  why_place_is_hard: >
    Australian funding records answer "which organisation was paid", never "where the work
    happened" — except GrantConnect, which publishes a delivery location on a minority of
    awards. Every distortion found this session came from reading an organisation's
    registered address as a statement about place.
  the_pattern_worth_internalising: >
    Nearly every error found ran in the same direction: it erased or understated Aboriginal
    community-controlled organisations. Remote NT mapped to a Western Australian shire. An
    alphabetical cap that cut off the Utopia names. Deregistered corporations shown as
    live. Councils crediting the hub. None of it malicious — all of it the result of
    infrastructure built around ACNC, postcodes and procurement, none of which fit remote
    Aboriginal Australia. Assume the next bug does the same thing and look for it there.

