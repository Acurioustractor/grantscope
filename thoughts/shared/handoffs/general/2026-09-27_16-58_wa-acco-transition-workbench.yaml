blockers:
  - The public SFPP display has no supported row-level export; incumbent contract number, release quarter, value band, term and agency contact remain unavailable in the bounded capture.

questions:
  - Will DTF provide an authorised SFPP CSV or XLSX extract?
  - Who governs ACCO cohort and readiness definitions?
  - Which of the four forward plans should be tested first with local authority?
  - Should this untracked work be committed as one feature or split into data and frontend commits?

decisions:
  - evidence_before_engagement: Public records may identify a review path but cannot establish ACCO readiness, local authority, demand or permission to contact.
  - exact_identity_only: Supplier links use ABN or unique exact normalised names and sourced aliases; ambiguous panels and fuzzy similarities remain unresolved.
  - jev_is_second_opinion: Jev reviewed the bounded queue but wrote no human decision, review status or outreach action.
  - forward_plans_are_not_awards: SFPP rows remain planned procurements and must not be presented as guaranteed tenders or transition decisions.
  - preserve_source_anomalies: Kalumburu Air Strip Resurfacing remains source-labelled Community Services but is excluded from human-service counts pending owner clarification.

findings:
  - current_scale: 17,055 WA contract records, 283 candidate or review records and 54 source-published Kimberley records.
  - entity_resolution: 7,054 of 20,283 supplier components have unique deterministic links; 1,570 are ambiguous and 11,659 unmatched; no fuzzy links are committed.
  - kimberley_resolution: 24 of 54 Kimberley queue records have a contract-level entity link and 11 carry a community-controlled discovery signal.
  - forward_signal: Four concrete Kimberley human-service procurements are planned for 2026-27 across Communities and the Mental Health Commission.
  - forward_gap: The public display omits the incumbent and commercial fields required to connect those plans to actual transition pathways.
  - source_state: The SFPP report said refreshed 21 September 2026; the bounded capture was made 27 September 2026 with Kimberley and Community Services filters.

