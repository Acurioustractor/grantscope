questions:
  - 'What is the first public cohort for Opportunity Commons, what information may be shared externally, and should Ask GrantScope launch as an ACT-only authenticated assistant before any public atlas?'

decisions:
  - evidence_contract: Official source, current timing, applicant eligibility, amount and project fit must pass before an opportunity becomes relevant; generated candidates never become labels automatically.
  - model_architecture: Use structured hard gates plus lexical, semantic and graph-guided retrieval; do not place the full 3.38M-edge graph in prompts or rely on embeddings alone.
  - operating_rhythm: Keep five funding decisions and twelve benchmark reviews as separate bounded weekly budgets joined in one Monday digest.
  - shared_opportunity: External sharing must be opt-in, consent-based and evidence-backed; do not expose private relationship context or infer community authority.
  - source_health: Count only the latest run per agent, so repaired sources clear rather than leaving historical failures red.

findings:
  - graph_scale: Verified live graph contains 609372 entities and 3381922 relationships; full build completed with zero permanent write failures and both materialized views refreshed.
  - funding_state: Latest snapshot has 35 apply-now opportunities, 661 quarantined, a full 5-item queue, 0 of 11 decision-ready profiles, and 12 benchmark reviews remaining.
  - benchmark_truth: Each active project has a 20-case pool, but no project yet has the required balanced human-labelled baseline; only explicit human reviews count.
  - source_repairs: GrantConnect refreshed 118 current opportunities; VIC refreshed 31; source failures fell from misleading 15 to one credential-blocked GHL sync.
  - product_direction: The strategic opportunity is a national activity and opportunity graph powering Ask GrantScope, place/funding-gap intelligence, governed opportunity sharing, and a capability-first Australian atlas.

